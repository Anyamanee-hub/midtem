        gallery: [
          "images/dakanda-1.jpg",
          "images/dakanda-2.jpg",
          "images/dakanda-3.jpg",
          "images/dakanda-4.jpg",
          "images/dakanda-5.jpg",
          "images/dakanda-6.jpg"
        ]
      },

      mo: {
        name: "โหม๋",
        film: "วิมานหนาม",
        category: "THAI FILM / OLD MEMORIES",
        image: "images/mo.jpg",
        description:
          "โหม๋เป็นหญิงสาวที่พยายามสร้างความมั่นคงให้กับชีวิตและครอบครัว ท่ามกลางความขัดแย้งเรื่องสิทธิในการเป็นเจ้าของบ้านและสวนทุเรียน เมื่อสิ่งที่ทุกคนต้องการกลายเป็นสิ่งเดียวกัน ความสัมพันธ์ในครอบครัวจึงเต็มไปด้วยการต่อรอง ความเจ็บปวด และการตัดสินใจที่ยากจะตัดสินจากมุมมองเดียว",
        quote:
          "เมื่อทุกคนต่างมีเหตุผลของตัวเอง ความถูกต้องอาจไม่ได้มีเพียงด้านเดียว",
        memory:
          "โหม๋เป็นตัวละครที่ทำให้เราตั้งคำถามถึงเส้นแบ่งระหว่างความจำเป็นกับความทะเยอทะยาน และความถูกต้องกับความต้องการส่วนตัว เธอสะท้อนให้เห็นว่าเมื่อชีวิตเต็มไปด้วยข้อจำกัด การตัดสินใจของคนคนหนึ่งอาจมีเหตุผลที่ซับซ้อนกว่าที่เรามองเห็น",
        gallery: [
          "images/dakanda-1.jpg",
          "images/dakanda-2.jpg",
          "images/dakanda-3.jpg",
          "images/dakanda-4.jpg",
          "images/dakanda-5.jpg",
          "images/dakanda-6.jpg"
        ]
      },

    };

    const params = new URLSearchParams(window.location.search);
    const characterId = params.get("id") || "dakanda";
    const character = characters[characterId];

    const mainImage = document.getElementById("mainImage");
    const gallery = document.getElementById("characterGallery");

    if (character) {
      document.title = character.name + " | Characters That Stay";

      document.getElementById("characterName").textContent =
        character.name;
      document.getElementById("characterSubtitle").textContent =
        character.subtitle;
      document.getElementById("filmName").textContent =
        character.film;
      document.getElementById("characterCategory").textContent =
        character.category;
      document.getElementById("characterDescription").textContent =
        character.description;
      document.getElementById("characterQuote").textContent =
        "“" + character.quote + "”";
      document.getElementById("characterMemory").textContent =
        character.memory;

      mainImage.src = character.image;
      mainImage.alt = character.name;
      mainImage.onerror = function () {
        this.alt = "ไม่พบไฟล์ภาพหลัก กรุณาตรวจสอบชื่อไฟล์";
      };

      character.gallery.forEach((imagePath, index) => {
        const image = document.createElement("img");
        image.src = imagePath;
        image.alt = character.name + " - moment " + (index + 1);
        image.loading = "lazy";

        image.onerror = function () {
          this.classList.add("image-missing");
          this.alt = "กรุณาเพิ่มรูป " + (index + 1) + " ในโฟลเดอร์ images";
        };

        image.addEventListener("click", () => {
          mainImage.src = imagePath;
          mainImage.alt = character.name + " - moment " + (index + 1);
        });

        gallery.appendChild(image);
      });
    } else {
      document.getElementById("characterName").textContent =
        "Character not found";
      document.getElementById("characterDescription").textContent =
        "ไม่พบข้อมูลตัวละคร กรุณาตรวจสอบ ID ของการ์ดในหน้า Collection";
      document.getElementById("characterSubtitle").textContent = "";
      document.getElementById("filmName").textContent = "";
      document.getElementById("characterQuote").textContent = "";
      document.getElementById("characterMemory").textContent = "";
      mainImage.style.display = "none";
    }
  </script>
